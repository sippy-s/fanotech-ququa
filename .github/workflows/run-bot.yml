name: Ququa Guest Bot (Heavy)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'تعداد کاربر (پیشنهاد: 50 برای تست)'
        required: true
        default: '10000'
      hold:
        description: 'ثانیه ماندن در اتاق (پیشنهاد: 30 برای تست)'
        required: true
        default: '600'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run bot
        run: |
          printf "%s\n%s\n" "${{ inputs.count }}" "${{ inputs.hold }}" | node --max-old-space-size=7000 app.js
        timeout-minutes: 340
