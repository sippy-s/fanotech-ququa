name: Ququa Guest Bot (Heavy)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'تعداد کاربر (پیشنهاد تست: 50)'
        required: true
        default: '5000'
      hold:
        description: 'ثانیه ماندن در اتاق (پیشنهاد تست: 30)'
        required: true
        default: '60'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Run bot
        run: node --max-old-space-size=7000 app.js ${{ inputs.count }} ${{ inputs.hold }}
        timeout-minutes: 340
